spring.application.name=flagforge-test

spring.datasource.url=jdbc:h2:mem:flagforge-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

flagforge.cache.type=memory
flagforge.messaging.type=logging

flagforge.security.jwt.secret=flagforge-test-secret-must-be-long-enough-for-hs256-algo!!
flagforge.security.jwt.expiration-ms=3600000

spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

logging.level.root=WARN
logging.level.com.flagforge=INFO
