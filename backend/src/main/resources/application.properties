# =============================================================================
# FlagForge – common configuration (local-first defaults)
# Profiles:
#   (default)  H2 + memory cache + logging events
#   docker     Postgres + Redis + Kafka  (docker compose up -d)
#   test       used by integration tests
# =============================================================================
spring.application.name=flagforge
server.port=8080

# -----------------------------------------------------------------------------
# Temporary H2 (default – no Docker required)
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:flagforge;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Avoid Windows temp-dir ownership crashes (Tomcat session store)
server.tomcat.basedir=${user.home}/.flagforge/tomcat

# -----------------------------------------------------------------------------
# Cache + messaging (overridden by docker profile)
# -----------------------------------------------------------------------------
flagforge.cache.type=memory
flagforge.messaging.type=logging

flagforge.kafka.topics.flags=flagforge.flags
flagforge.kafka.topics.rollouts=flagforge.rollouts

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=flagforge
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Exclude Redis/Kafka autoconfig for local-first bootstrap
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# -----------------------------------------------------------------------------
# JWT (local dev only – override in production)
# -----------------------------------------------------------------------------
flagforge.security.jwt.secret=flagforge-dev-secret-change-me-in-production-must-be-long-enough-256bits
flagforge.security.jwt.expiration-ms=86400000

# -----------------------------------------------------------------------------
# SpringDoc OpenAPI
# -----------------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.flagforge=DEBUG
logging.level.org.springframework.security=INFO
