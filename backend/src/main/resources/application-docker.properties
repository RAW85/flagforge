# =============================================================================
# Profile: docker — Postgres + Redis + Kafka
# Host BE:   postgres/redis/kafka on localhost (compose ports)
# Docker BE: override hosts via env (SPRING_DATASOURCE_URL, SPRING_DATA_REDIS_HOST, …)
# =============================================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/flagforge}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:flagforge}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:flagforge}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.h2.console.enabled=false

flagforge.cache.type=redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

flagforge.messaging.type=kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=flagforge
spring.kafka.consumer.auto-offset-reset=earliest

spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

logging.level.com.flagforge.infrastructure.cache=DEBUG
logging.level.com.flagforge.infrastructure.messaging=DEBUG
