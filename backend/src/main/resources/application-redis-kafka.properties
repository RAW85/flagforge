# =============================================================================
# Profile: redis-kafka — H2 + Redis + Kafka
# Host BE:   redis/kafka on localhost
# Docker BE: override hosts via env (SPRING_DATA_REDIS_HOST, SPRING_KAFKA_BOOTSTRAP_SERVERS)
# =============================================================================

# H2 remains from application.properties unless SPRING_DATASOURCE_URL is set

flagforge.cache.type=redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

flagforge.messaging.type=kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=flagforge
spring.kafka.consumer.auto-offset-reset=earliest

spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

logging.level.com.flagforge.infrastructure.cache=DEBUG
logging.level.com.flagforge.infrastructure.messaging=DEBUG
