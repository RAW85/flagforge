# FlagForge Docker Compose
# Profiles:
#   redis-kafka  — redis + kafka (for host BE/FE)
#   docker-h2    — redis + kafka + backend + frontend (H2 inside backend)
#   docker-full  — postgres + redis + kafka + backend + frontend
#
#   docker compose --profile redis-kafka up -d
#   docker compose --profile docker-h2 up -d --build
#   docker compose --profile docker-full up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: flagforge-postgres
    profiles: ["docker-full"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: flagforge
      POSTGRES_USER: flagforge
      POSTGRES_PASSWORD: flagforge
    ports:
      - "5432:5432"
    volumes:
      - flagforge_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flagforge -d flagforge"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flagforge-redis
    profiles: ["redis-kafka", "docker-h2", "docker-full"]
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - flagforge_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # INTERNAL kafka:29092 for containers; EXTERNAL localhost:9092 for host apps
  kafka:
    image: bitnami/kafka:3.9
    container_name: flagforge-kafka
    profiles: ["redis-kafka", "docker-h2", "docker-full"]
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - flagforge_kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 40s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flagforge-backend
    profiles: ["docker-h2", "docker-full"]
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ${BACKEND_ENV_FILE:-./deploy/backend-h2.env}
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flagforge-frontend
    profiles: ["docker-h2", "docker-full"]
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  flagforge_pg_data:
  flagforge_redis_data:
  flagforge_kafka_data:
